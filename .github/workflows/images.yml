name: Images

# Builds the headless iptv-server image (Dockerfile) for the homelab cluster (amd64)
# and pushes it to GHCR as ghcr.io/nschnarr/iptv-server:sha-<short sha> and :main.
# The homelab repo pins the sha tag in apps/iptv/. Pull requests build the image
# without pushing, so a broken Dockerfile shows up before the merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build iptv-server
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/iptv-server
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=iptv-server
          cache-to: type=gha,mode=max,scope=iptv-server
